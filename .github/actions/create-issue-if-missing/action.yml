name: 'Create Issue If Missing'
description: 'Idempotently creates a GitHub issue by title, ensuring its labels exist first.'
inputs:
  title:
    description: 'Issue title'
    required: true
  labels:
    description: 'Comma-separated label names (no space required after commas)'
    required: false
    default: ''
  body:
    description: 'Issue body (markdown)'
    required: true
  github-token:
    description: 'Token used to authenticate the gh CLI'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Ensure labels exist
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        IFS=',' read -ra LABELS <<< "${{ inputs.labels }}"
        for label in "${LABELS[@]}"; do
          trimmed=$(echo "$label" | sed 's/^ *//;s/ *$//')
          [ -z "$trimmed" ] && continue
          if ! gh label create "$trimmed" --repo "${{ github.repository }}" --color "ededed" 2>/tmp/label_err.txt; then
            grep -qi "already exists" /tmp/label_err.txt || { cat /tmp/label_err.txt >&2; exit 1; }
          fi
        done

    - name: Create issue if it doesn't already exist
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ inputs.title }}
        ISSUE_BODY: ${{ inputs.body }}
        ISSUE_LABELS: ${{ inputs.labels }}
      run: |
        if ! titles=$(gh api --paginate \
          "repos/${{ github.repository }}/issues?state=all&per_page=100" \
          --jq '.[] | select(has("pull_request") | not) | .title'); then
          echo "Error: Failed to fetch issues to check for duplicates. Failing closed." >&2
          exit 1
        fi

        if echo "$titles" | grep -qxF "$ISSUE_TITLE" > /dev/null; then
          echo "Issue '${ISSUE_TITLE}' already exists — skipping."
          exit 0
        fi

        label_args=()
        IFS=',' read -ra LABELS <<< "$ISSUE_LABELS"
        for label in "${LABELS[@]}"; do
          trimmed=$(echo "$label" | sed 's/^ *//;s/ *$//')
          [ -z "$trimmed" ] && continue
          label_args+=(--label "$trimmed")
        done

        gh issue create \
          --repo "${{ github.repository }}" \
          --title "$ISSUE_TITLE" \
          "${label_args[@]}" \
          --body "$ISSUE_BODY"